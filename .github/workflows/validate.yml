name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: validate submission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install
        run: pip install -r requirements.txt

      - name: fetch official repo
        run: python tools/fetch_official.py

      - name: build submission
        # CI has no match bundle (the data is gated and must never be in the
        # repo). So here we test the CHAIN, not the score: the file must be
        # produced, have the right length, and respect the contract. The real
        # score is measured locally, on a machine that has the data.
        run: python run.py --placeholder

      - name: validate + score
        run: python tools/gate0.py
